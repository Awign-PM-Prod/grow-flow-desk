# Grow Flow Desk — production stack
# Frontend (nginx SPA): host port 1111 → container 80
# Backend (Supabase gateway): host port 2222 → container 4000
#
# HTTPS site (awigncrm.awignhub.in) must use same-origin API URLs. Nginx in the
# frontend container proxies /auth /rest /functions /storage /realtime /api to
# the backend service so the browser never makes http://…:2222 calls (Mixed Content).
#
# Compose reads root `.env` for ${VARS} (Vite build args).
# Backend secrets come from `backend/.env` via env_file.
services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "2222:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same HTTPS origin as the SPA — nginx proxies API paths to backend.
        VITE_API_URL: ${VITE_API_URL:-https://awigncrm.awignhub.in}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://awigncrm.awignhub.in}
    ports:
      - "1111:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
